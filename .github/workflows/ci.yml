name: repository-policy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-policy-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned backend dependencies
        run: python -m pip install -r backend/requirements-lock.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Lint backend and repository checks
        run: ruff check backend/src backend/tests scripts tests
      - name: Verify Python formatting
        run: ruff format --check backend/src backend/tests scripts tests
      - name: Test FastAPI foundation
        run: pytest -c backend/pyproject.toml backend/tests
      - name: Validate repository policy
        run: python scripts/check_repository.py
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v
      - name: Validate toolchain manifest JSON
        run: python -m json.tool config/toolchain-versions.json >/dev/null
      - name: Validate shared contract JSON
        run: python -m json.tool contracts/health-response.schema.json >/dev/null
